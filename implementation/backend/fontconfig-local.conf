<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Dónde cae un documento cuando su tipografía no carga.

  El contenedor solo tiene fonts-liberation (Sans, Serif, Mono, Sans Narrow) y
  Noto Color Emoji. Sin este fichero, fontconfig resolvía `sans-serif` a
  **Liberation Mono** — medido el 15/09/2026 con `fc-match sans-serif` —, así
  que una propuesta cuya Inter no llegó a descargarse salió ENTERA en Courier y
  así la recibió el cliente.

  Aquí se declara lo obvio: sans-serif → Liberation Sans, serif → Liberation
  Serif, monospace → Liberation Mono. Y se mapean las familias del respaldo que
  escriben los documentos (Arial, Helvetica, Roboto, Segoe UI, Noto Sans…) a la
  Sans, que es lo que un lector espera ver.

  Esto NO cambia ningún documento cuya fuente sí carga: solo decide el respaldo.
-->
<fontconfig>

  <!-- Las tres genéricas, en su sitio -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

  <!-- Las familias que los documentos nombran como respaldo y no existen aquí.
       Todas son sans: si alguna se resolviera sola, acabaría en Mono igual. -->
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Roboto</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Noto Sans</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>system-ui</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>ui-sans-serif</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>-apple-system</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><accept><family>Liberation Sans</family></accept></alias>
  <!-- Las dos que se auto-alojan: si su descarga fallase, también a la Sans -->
  <alias binding="same"><family>Inter</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Instrument Sans</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Archivo</family><accept><family>Liberation Sans</family></accept></alias>

</fontconfig>
