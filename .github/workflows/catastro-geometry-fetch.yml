name: Catastro geometry — traer datos reales

# SOLO a mano. Nunca en push: cada ejecucion pega al Catastro de verdad.
#
# Existe porque el entorno donde se desarrolla el MVP no tiene salida a
# ovc.catastro.meh.es. Esto lo ejecuta desde un runner de GitHub, guarda las
# respuestas CRUDAS en el repo y asi el analisis se hace despues sin red
# (--offline), sin volver a pedirle nada a Catastro.
#
# FRENOS, porque al otro lado hay un WAF del que depende el buscador de la app
# en produccion:
#   * concurrency: nunca dos ejecuciones a la vez;
#   * la fase 'reconocimiento' son SEIS peticiones exactas y se hace ANTES de
#     pedir ningun dato, para no adivinar parametros a base de intentos;
#   * pausa configurable entre peticiones (1,5 s por defecto);
#   * al primer 403 o "no se puede procesar" se PARA, no se reintenta;
#   * max_vecinos limita el numero de colindantes que se consultan.
#
# El runner sale por IPs de Azure, no por la del VPS: si el WAF se molesta,
# produccion no se entera.

# Se dispara de DOS formas, y las dos son a mano:
#   1. workflow_dispatch, cuando este fichero llegue a la rama por defecto
#      (GitHub solo registra ese disparador desde main);
#   2. mientras tanto, escribiendo catastro-geometry/.disparar/parametros.json
#      en esta rama. Los parametros se leen de ese fichero.
on:
  push:
    paths:
      - "catastro-geometry/.disparar/**"
  workflow_dispatch:
    inputs:
      fase:
        description: "reconocimiento (6 peticiones) o datos (la parcela entera)"
        type: choice
        options: [reconocimiento, datos]
        default: reconocimiento
      refcat:
        description: "Referencia catastral (14 o 20)"
        default: "4410205WJ0641S0001JH"
      max_vecinos:
        description: "Parcelas colindantes a consultar (2 peticiones por vecino)"
        default: "4"
      pausa:
        description: "Segundos entre peticiones"
        default: "1.5"

concurrency:
  group: catastro-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catastro-geometry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --quiet shapely pyproj lxml numpy folium matplotlib

      - name: Resolver parametros
        id: par
        run: |
          F=.disparar/parametros.json
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fase=${{ inputs.fase }}"               >> $GITHUB_OUTPUT
            echo "refcat=${{ inputs.refcat }}"           >> $GITHUB_OUTPUT
            echo "max_vecinos=${{ inputs.max_vecinos }}" >> $GITHUB_OUTPUT
            echo "pausa=${{ inputs.pausa }}"             >> $GITHUB_OUTPUT
          elif [ -f "$F" ]; then
            python - "$F" >> $GITHUB_OUTPUT <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("fase=" + str(d.get("fase", "reconocimiento")))
          print("refcat=" + str(d.get("refcat", "")))
          print("max_vecinos=" + str(d.get("max_vecinos", 4)))
          print("pausa=" + str(d.get("pausa", 1.5)))
          PY
          else
            echo "No hay parametros que aplicar." && exit 1
          fi
          cat $GITHUB_OUTPUT

      - name: Reconocimiento (6 peticiones)
        if: ${{ steps.par.outputs.fase == 'reconocimiento' }}
        run: python tools/reconocer.py data/reconocimiento "${{ steps.par.outputs.pausa }}"

      - name: Traer los datos de la parcela
        if: ${{ steps.par.outputs.fase == 'datos' }}
        run: |
          python -m src.main "${{ steps.par.outputs.refcat }}" \
            --only-fetch \
            --pausa "${{ steps.par.outputs.pausa }}" \
            --retries 1 \
            --timeout 25 \
            --max-vecinos "${{ steps.par.outputs.max_vecinos }}" \
            --data "data/real" \
            --cache "cache"

      - name: Guardar tambien como artefacto (por si el commit falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catastro-crudo
          path: |
            catastro-geometry/data
            catastro-geometry/cache
          if-no-files-found: warn
          retention-days: 7

      - name: Cuantas peticiones se han gastado
        if: always()
        run: |
          echo "### Ficheros traidos" >> $GITHUB_STEP_SUMMARY
          find data cache -type f 2>/dev/null | head -40 >> $GITHUB_STEP_SUMMARY || true

      - name: Commit de las respuestas crudas
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # OJO: `git add a b c` aborta ENTERO si una de las rutas no existe, y
          # con el `|| true` no se commitea nada y el job sale en verde. Una a una.
          for d in data/reconocimiento data/real data/raw cache; do
            [ -d "$d" ] && git add -f "$d" || true
          done
          if git diff --cached --quiet; then
            echo "nada que commitear"
          else
            git commit -m "Catastro: respuestas crudas (${{ steps.par.outputs.fase }}, ${{ steps.par.outputs.refcat }})

          Traidas por el workflow manual desde un runner de GitHub, porque el
          entorno de desarrollo no tiene salida a ovc.catastro.meh.es.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            git push
          fi
