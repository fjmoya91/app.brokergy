# ===== rite.brokergy.es — App RITE (regla 245) =====
# Copia de REFERENCIA, como cee.brokergy.es.conf: el nginx.conf que manda es el
# del VPS (/opt/brokergy/nginx/nginx.conf, fuera de git). Estos dos bloques se
# pegan dentro de su `http { }`, después del de cee.brokergy.es.
#
# MISMO build que el CRM (tercera entrada de Vite, rite.html) y MISMA API: solo
# cambia la página de entrada. El CORS lo admite el backend por RITEAPP_URL
# (utils/corsOrigenes.js).
#
# Alta del certificado (una vez, con el DNS `rite` ya apuntando al VPS):
#   1) pegar SOLO el bloque :80 y `docker compose exec nginx nginx -s reload`
#   2) certbot certonly --webroot -w /var/www/certbot -d rite.brokergy.es
#   3) pegar el bloque :443, `nginx -t` y reload

server {
    listen 80;
    server_name rite.brokergy.es;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name rite.brokergy.es;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/rite.brokergy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rite.brokergy.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }

    # Generar: el rite-generator hace el Word, lo pasa a PDF y lo sube a Drive.
    location ~ ^/api/riteapp/memorias/[^/]+/generar$ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location ^~ /fonts/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    root /usr/share/nginx/html;
    # La entrada de ESTA app; el index.html del CRM no se sirve aquí.
    index rite.html;
    location ~ .mjs$ { default_type text/javascript; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /rite.html;
    }
}
