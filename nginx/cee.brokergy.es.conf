# ===== cee.brokergy.es — App de certificadores =====
# Copia de REFERENCIA: el nginx.conf que manda es el del VPS
# (/opt/brokergy/nginx/nginx.conf, fuera de git). Estos dos bloques se pegan
# dentro de su `http { }`, después del de app.brokergy.es.
#
# Es el MISMO build que el CRM (segunda entrada de Vite, certificadores.html)
# y la MISMA API: solo cambia la página de entrada. Aunque /api/ sea del mismo
# host, el navegador manda `Origin: https://cee.brokergy.es` en los POST y el CORS
# del backend lo admite por CERTAPP_URL (server.js), no por FRONTEND_URL.
#
# Alta del certificado (una vez, con el DNS ya apuntando al VPS):
#   1) pegar SOLO el bloque :80 y `docker compose exec nginx nginx -s reload`
#   2) certbot certonly --webroot -w /var/www/certbot -d cee.brokergy.es
#   3) pegar el bloque :443, `nginx -t` y reload
# La renovación la hace el cron de siempre (renew-certs.sh + certbot.timer).

server {
    listen 80;
    server_name cee.brokergy.es;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name cee.brokergy.es;
    client_max_body_size 120m;

    ssl_certificate /etc/letsencrypt/live/cee.brokergy.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cee.brokergy.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }

    # La envolvente: medir un edificio pasa de los 120 s (mismo motivo que en app.brokergy.es)
    location ~ ^/api/cee-envolvente/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location ^~ /fonts/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    root /usr/share/nginx/html;
    # La entrada de ESTA app; el index.html del CRM no se sirve aquí.
    index certificadores.html;
    location ~ .mjs$ { default_type text/javascript; try_files $uri =404; }
    # El croquis desde el móvil (el QR de la envolvente) es una página pública
    # de la entrada del CRM: aquí también la sirve el index.html.
    location ^~ /croquis-movil/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }
    location / {
        # Sin caché, como en el CRM: una PWA con el HTML viejo abre en blanco.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /certificadores.html;
    }
}
