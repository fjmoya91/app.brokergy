version: '3.8'

services:
  backend:
    # Contexto = ./implementation (no ./implementation/backend): el backend importa
    # en runtime la lógica ESM de frontend/src (matemática del CAE, CIFO, RES080) y
    # solo desde este contexto se puede copiar dentro de la imagen.
    # El .dockerignore que aplica pasa a ser implementation/.dockerignore.
    build:
      context: ./implementation
      dockerfile: backend/Dockerfile
    container_name: brokergy-backend
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ./implementation/backend/.env
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
      - RITE_SERVICE_URL=http://rite-generator:8080
      - CEE_ENGINE_URL=http://cee-engine:8080
      # Timbre del canal de trabajo con Fran: avisa al contenedor «asistente» cuando él escribe.
      # Su número va en el .env (ASISTENTE_WHATSAPP_TEL), nunca aquí: el repo es público.
      - ASISTENTE_URL=http://asistente:8091
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
      - whatsapp_cache:/app/.wwebjs_cache
    networks:
      - brokergy

  mcp:
    build: ./implementation/backend/mcp-brokergy
    container_name: brokergy-mcp
    restart: unless-stopped
    env_file: ./implementation/backend/.env
    environment:
      - MCP_PORT=3001
    networks:
      - brokergy

  # Motor de envolvente termica (CE3X). Python por la misma razon que el RITE:
  # GEOS y PROJ no tienen equivalente en Node, y el .cex son pickles de Python.
  cee-engine:
    build: ./implementation/cee-engine
    container_name: brokergy-cee-engine
    restart: unless-stopped
    environment:
      - PORT=8080
      - CEE_CACHE_DIR=/cache
    volumes:
      # La cache de Catastro SOBREVIVE a los despliegues a proposito: cada
      # consulta pasa por el mismo WAF del que depende el buscador en
      # produccion, y lo que ya se pregunto una vez no se vuelve a preguntar.
      - cee_cache:/cache
    networks:
      - brokergy

  rite-generator:
    build: ./implementation/rite-generator
    container_name: brokergy-rite
    restart: unless-stopped
    environment:
      - PORT=8080
    networks:
      - brokergy

  # El asistente de Fran por WhatsApp: Claude Code sin pantalla que trabaja con los scripts de
  # la app (implementation/asistente/). Se construye SOBRE la imagen del backend, así que hay
  # que construir antes el backend. El repo va MONTADO: un `git pull` le cambia los scripts y
  # las instrucciones sin reconstruir. No publica puertos: solo le habla el backend.
  asistente:
    build: ./implementation/asistente
    container_name: brokergy-asistente
    restart: unless-stopped
    env_file: ./implementation/backend/.env
    environment:
      - NODE_ENV=production
      - BROKERGY_API_URL=http://backend:3000
      - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/chrome-nosandbox
      # Claude Code se niega a saltarse los permisos como root salvo en un contenedor declarado.
      - IS_SANDBOX=1
      - CLAUDE_CONFIG_DIR=/root/.claude
      - ASISTENTE_PUERTO=8091
    volumes:
      - ./:/repo
      - asistente_claude:/root/.claude
    depends_on:
      - backend
    networks:
      - brokergy

  nginx:
    image: nginx:alpine
    container_name: brokergy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./implementation/frontend/dist:/usr/share/nginx/html:ro
      # Escaparate de instaladores (repo aparte, build propio en /opt/marketplace).
      # instaladores.brokergy.es sirve desde aquí; ver repo marketplace/DEPLOY.md.
      - /opt/marketplace/dist:/usr/share/nginx/marketplace:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - brokergy

volumes:
  asistente_claude:
  cee_cache:
  whatsapp_auth:
  whatsapp_cache:

networks:
  brokergy:
    driver: bridge
